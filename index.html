<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tap Frenzy | Neon Edition</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="game-container">
        <!-- Background Elements -->
        <div class="bg-glow"></div>
        <div class="grid-overlay"></div>

        <!-- HUD -->
        <div id="hud">
            <div class="stat-group">
                <span class="stat-label">SCORE</span>
                <span id="score" class="stat-value">0</span>
            </div>
            <div class="stat-group center">
                <span id="combo-badge" class="badge">x1</span>
                <div class="combo-container">
                    <div id="combo-bar"></div>
                </div>
            </div>
            <div class="stat-group right">
                <span class="stat-label">LIVES</span>
                <div id="lives-container" class="lives">
                    <div class="life active"></div>
                    <div class="life active"></div>
                    <div class="life active"></div>
                </div>
            </div>
        </div>

        <!-- Game Arena -->
        <div id="arena"></div>

        <!-- Screens -->
        <div id="screen-overlay" class="overlay visible">
            <!-- Start Screen -->
            <div id="start-screen" class="screen">
                <h1 class="glitch-text" data-text="TAP FRENZY">TAP FRENZY</h1>
                <p class="subtitle">NEON EDITION</p>
                
                <div class="instructions">
                    <div class="instruction-item">
                        <span class="icon standard"></span>
                        <span>Tap circles before they vanish</span>
                    </div>
                    <div class="instruction-item">
                        <span class="icon gold"></span>
                        <span>Golden ones give bonus points</span>
                    </div>
                    <div class="instruction-item">
                        <span class="icon bomb"></span>
                        <span>Avoid the red bombs!</span>
                    </div>
                </div>

                <div class="input-wrapper">
                    <input type="text" id="player-name" placeholder="ENTER INITIALS" maxlength="3">
                </div>

                <button id="start-btn" class="primary-btn">INITIALIZE SEQUENCE</button>
                
                <div class="high-score-hint">
                    BEST: <span id="best-score">0</span>
                </div>
            </div>

            <!-- Game Over Screen -->
            <div id="game-over-screen" class="screen hidden">
                <h2 class="game-over-title">SEQUENCE TERMINATED</h2>
                
                <div class="final-stats">
                    <div class="final-stat">
                        <span class="label">FINAL SCORE</span>
                        <span id="final-score" class="value">0</span>
                    </div>
                    <div class="final-stat">
                        <span class="label">MAX COMBO</span>
                        <span id="max-combo" class="value">x1</span>
                    </div>
                </div>

                <div id="leaderboard">
                    <h3>ELITE OPERATORS</h3>
                    <div id="leaderboard-list">
                        <!-- Populated by JS -->
                    </div>
                </div>

                <button id="restart-btn" class="primary-btn">REBOOT SYSTEM</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
